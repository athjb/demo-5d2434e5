urning on. That's the gap.`],[`Translation is the work: crawl the business, map the journeys people actually want, build components for each, wire each one to the system that owns it.`,`Agent crews draft every step and a person reviews it. It's a guided pipeline, not a magic button.`,`The scorecard is honest about what's open today (Shopify), link-only (Sawyer deep links) and what needs a partnership (live Sawyer booking).`,`Pulse stays the brain: it reads intent and decides what to present. This layer gives Pulse something to present at small-business scale.`],[`The component library you build for rich RCS is the same library agents need.`,`Same party builder, same checkout. It renders as an RCS web view, as an MCP App in ChatGPT or Claude, or as a plain web link.`,`Businesses want RCS because they own the experience. When an agent finds them, they push their own flow instead of the agent guessing on the website.`,`Instinct finds the entrance and fires the RCS conversation. ChatGPT or Claude pulls the MCP App directly.`],[`Your advantage is the RCS relationship and Pulse. The businesses Google turns on still need content, and that's an onboarding job.`,`Be the onboarding layer for Google's RCS wave: every business you onboard becomes a set of components wired to its systems.`,`That compounds into a flywheel: more businesses, more shared components, and a directory of business flows agents can look up. about.chat is a working concept for that.`,`Proposed next step: a pilot onboarding N local businesses. Let's pick N and the categories together.`]];function ed({title:e,children:t}){return(0,R.jsxs)(`div`,{className:`mx-auto w-full max-w-[320px] overflow-hidden rounded-[22px] border-4 border-slate-900 bg-white shadow-md`,children:[(0,R.jsxs)(`div`,{className:`flex items-center gap-2 border-b px-3 py-2`,children:[(0,R.jsx)(pu,{size:26}),(0,R.jsxs)(`div`,{className:`min-w-0 leading-tight`,children:[(0,R.jsxs)(`div`,{className:`flex items-center gap-1 text-[13px] font-se
